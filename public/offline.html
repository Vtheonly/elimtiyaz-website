<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Hors ligne — El-Imtiyaz Portal</title>
  <meta name="theme-color" content="#242526">
  <link rel="icon" href="/icon.svg">
  <!--
    T-385 (I18N-500): the service-worker offline fallback is a STATIC page —
    it cannot read the app's zustand locale store and it must render with
    ZERO network access. The three language variants are embedded inline;
    a tiny script picks the closest match to the browser language BEFORE
    first paint (script is synchronous, placed in <head> to avoid a flash
    of French for Arabic/English users). The localStorage key matches the
    app store's persisted locale when available (el-imtiyaz-portal-prefs).
  -->
  <script>
    (function () {
      var I18N = {
        fr: {
          title: "Hors ligne — El-Imtiyaz Portal",
          h1: "Vous êtes hors ligne",
          p: "Le portail El-Imtiyaz ne peut pas se connecter à internet. Vérifiez votre connexion réseau puis réessayez. Les données déjà consultées restent disponibles ci-dessous.",
          retry: "Réessayer"
        },
        ar: {
          title: "غير متصل — بوابة الإمتياذ",
          h1: "أنت غير متصل بالإنترنت",
          p: "لا تستطيع بوابة الإمتياذ الاتصال بالإنترنت. تحقق من اتصالك بالشبكة ثم أعد المحاولة. تبقى البيانات التي استعرضتها سابقًا متاحة أدناه.",
          retry: "إعادة المحاولة"
        },
        en: {
          title: "Offline — El-Imtiyaz Portal",
          h1: "You are offline",
          p: "The El-Imtiyaz portal cannot connect to the internet. Check your network connection and try again. Data you have already viewed remains available below.",
          retry: "Try again"
        }
      };
      var locale = "fr";
      try {
        var saved = localStorage.getItem("el-imtiyaz-portal-prefs");
        if (saved) {
          var parsed = JSON.parse(saved);
          if (parsed && parsed.state && parsed.state.locale && I18N[parsed.state.locale]) {
            locale = parsed.state.locale;
          }
        }
      } catch (e) { /* fall through to navigator language */ }
      if (locale === "fr") {
        var nav = (navigator.language || "fr").toLowerCase();
        if (nav.indexOf("ar") === 0) locale = "ar";
        else if (nav.indexOf("en") === 0) locale = "en";
      }
      var s = I18N[locale];
      document.documentElement.lang = locale;
      document.documentElement.dir = locale === "ar" ? "rtl" : "ltr";
      document.title = s.title;
      window.__OFFLINE_I18N__ = s;
    })();
  </script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
      background: #242526;
      color: #EFF2F3;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
      text-align: center;
    }
    .icon {
      width: 4rem;
      height: 4rem;
      border-radius: 1rem;
      background: rgba(52, 155, 212, 0.15);
      color: #349BD4;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1.5rem;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }
    p {
      font-size: 0.9375rem;
      color: #9CA3AF;
      max-width: 28rem;
      line-height: 1.6;
      margin-bottom: 1.5rem;
    }
    button {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 1.5rem;
      border-radius: 0.5rem;
      border: 1px solid rgba(239, 242, 243, 0.2);
      background: #349BD4;
      color: #fff;
      font-size: 0.9375rem;
      font-weight: 500;
      cursor: pointer;
      min-height: 44px;
      transition: background 0.2s;
    }
    button:hover { background: #2B7FB0; }
    .brand {
      position: fixed;
      bottom: 1.5rem;
      font-size: 0.75rem;
      color: #6B7280;
      font-family: ui-monospace, monospace;
    }
  </style>
</head>
<body>
  <div class="icon">
    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="1" y1="1" x2="23" y2="23"></line>
      <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
      <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
      <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
      <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
      <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
      <line x1="12" y1="20" x2="12.01" y2="20"></line>
    </svg>
  </div>
  <h1 data-i18n="h1">Vous êtes hors ligne</h1>
  <p data-i18n="p">
    Le portail El-Imtiyaz ne peut pas se connecter à internet. Vérifiez votre
    connexion réseau puis réessayez. Les données déjà consultées restent
    disponibles ci-dessous.
  </p>
  <button onclick="window.location.reload()">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="23 4 23 10 17 10"></polyline>
      <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
    </svg>
    <span data-i18n="retry">Réessayer</span>
  </button>
  <div class="brand">El-Imtiyaz Portal</div>
  <script>
    // Apply the locale picked in <head> to the labeled nodes (keeps the
    // French markup as the no-JS / crawler fallback).
    (function () {
      var s = window.__OFFLINE_I18N__;
      if (!s) return;
      var nodes = document.querySelectorAll("[data-i18n]");
      for (var i = 0; i < nodes.length; i++) {
        var key = nodes[i].getAttribute("data-i18n");
        if (s[key]) nodes[i].textContent = s[key];
      }
    })();
  </script>
</body>
</html>
